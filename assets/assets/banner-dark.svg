<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340">

<defs>

<linearGradient id="background"
 x1="0%" y1="0%"
 x2="100%" y2="100%">

```
<stop offset="0%" stop-color="#171124"/>
<stop offset="45%" stop-color="#251535"/>
<stop offset="100%" stop-color="#35172F"/>
```

  </linearGradient>

  <radialGradient id="pinkGlow">

```
<stop
  offset="0%"
  stop-color="#E77EB8"
  stop-opacity=".55"/>

<stop
  offset="100%"
  stop-color="#E77EB8"
  stop-opacity="0"/>
```

  </radialGradient>

  <radialGradient id="purpleGlow">

```
<stop
  offset="0%"
  stop-color="#B87CFF"
  stop-opacity=".55"/>

<stop
  offset="100%"
  stop-color="#B87CFF"
  stop-opacity="0"/>
```

  </radialGradient>

  <filter id="blur">

```
<feGaussianBlur stdDeviation="22"/>
```

  </filter>

</defs>

<!-- BACKGROUND -->

<rect
width="1200"
height="340"
rx="30"
fill="url(#background)"/>

<!-- GLOWS -->

<circle
cx="130"
cy="80"
r="130"
fill="url(#pinkGlow)"
filter="url(#blur)">

<animate
 attributeName="r"
 values="100;140;100"
 dur="5s"
 repeatCount="indefinite"/>

</circle>

<circle
cx="1080"
cy="270"
r="140"
fill="url(#purpleGlow)"
filter="url(#blur)">

<animate
 attributeName="r"
 values="140;105;140"
 dur="6s"
 repeatCount="indefinite"/>

</circle>

<!-- STARS -->

<g
fill="#F4B7FF"
font-family="Arial">

  <text x="90" y="90" font-size="30">

```
✦

<animate
