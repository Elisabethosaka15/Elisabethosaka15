<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340">

<defs>

<linearGradient id="background"
 x1="0%" y1="0%"
 x2="100%" y2="100%">

```
<stop offset="0%" stop-color="#FFF8FC"/>
<stop offset="45%" stop-color="#F8EEFF"/>
<stop offset="100%" stop-color="#FDEAF4"/>
```

  </linearGradient>

  <radialGradient id="pinkGlow">

```
<stop
  offset="0%"
  stop-color="#F2A6D2"
  stop-opacity=".65"/>

<stop
  offset="100%"
  stop-color="#F2A6D2"
  stop-opacity="0"/>
```

  </radialGradient>

  <radialGradient id="purpleGlow">

```
<stop
  offset="0%"
  stop-color="#C89BFF"
  stop-opacity=".55"/>

<stop
  offset="100%"
  stop-color="#C89BFF"
  stop-opacity="0"/>
```

  </radialGradient>

  <filter id="blur">

```
<feGaussianBlur stdDeviation="20"/>
```

  </filter>

</defs>

<!-- BACKGROUND -->

<rect
width="1200"
height="340"
rx="30"
fill="url(#background)"/>

<!-- PINK GLOW -->

<circle
cx="130"
cy="80"
r="130"
fill="url(#pinkGlow)"
filter="url(#blur)">

<animate
 attributeName="r"
 values="100;140;100"
 dur="5s"
 repeatCount="indefinite"/>

</circle>

<!-- PURPLE GLOW -->

<circle
cx="1080"
cy="270"
r="140"
fill="url(#purpleGlow)"
filter="url(#blur)">

<animate
 attributeName="r"
 values="140;105;140"
 dur="6s"
 repeatCount="indefinite"/>

</circle>

<!-- FLOATING SPARKLES -->

<g
fill="#B978D1"
font-family="Arial">

  <text x="90" y="90" font-size="30">

